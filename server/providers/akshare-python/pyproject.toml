[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-server-akshare"
version = "0.1.0"
description = "Process-isolated AKShare provider bridge for Market Server"
requires-python = ">=3.11"
dependencies = ["akshare==1.18.82"]

[tool.setuptools.packages.find]
include = ["market_server_akshare*"]
