openapi: 3.1.0
info:
  title: EVA 服务端 API
  version: 1.0.0
  description: Provider-independent market data API for EVA CLI.
paths:
  /v1/health:
    get:
      security:
        - ApiKey: []
      operationId: getHealth
      summary: Report process liveness and provider readiness
      responses:
        '200':
          description: Current service health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/data-sources:
    get:
      operationId: listDataSources
      summary: List categorized upstream data-source health and check schedule
      responses:
        '200':
          description: Current upstream health grouped by source and instrument category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceListResponse'
  /v1/data-sources/check:
    post:
      operationId: checkDataSources
      summary: Run immediate checks for all source and category combinations
      responses:
        '200':
          description: Provider health state after the checks complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceListResponse'
  /v1/data-sources/schedule:
    put:
      operationId: updateDataSourceSchedule
      summary: Enable, disable, or update scheduled upstream health checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                  default: true
                interval_seconds:
                  type: integer
                  minimum: 5
                  maximum: 86400
      responses:
        '200':
          description: Updated health-check schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceListResponse'
        default:
          description: Invalid schedule configuration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/data-sync:
    get:
      operationId: getDataSyncStatus
      summary: Get local historical warehouse and synchronization status
      responses:
        '200':
          description: Current storage summary and active or latest run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncStatusResponse'
  /v1/data-sync/runs:
    post:
      operationId: startDataSyncRun
      summary: Start a background daily or one-minute bar synchronization run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSyncRequest'
      responses:
        '202':
          description: Synchronization run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncRunResponse'
        default:
          description: Invalid request or another run is active.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/data-sync/schedules:
    post:
      operationId: createDataSyncSchedule
      summary: Create a daily recurring synchronization task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSyncScheduleRequest'
      responses:
        '201':
          description: Scheduled synchronization task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncScheduleResponse'
        default:
          description: Invalid schedule configuration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/data-sync/schedules/{scheduleId}:
    delete:
      operationId: deleteDataSyncSchedule
      summary: Revoke a scheduled synchronization task
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Scheduled synchronization task revoked.
        default:
          description: Invalid schedule identifier or task not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/data-sync/cancel:
    post:
      operationId: cancelDataSyncRun
      summary: Request cancellation of the active synchronization run
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncRunResponse'
        default:
          description: No synchronization run is active.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/data-sync/resume:
    post:
      operationId: resumeDataSyncRun
      summary: Resume the latest interrupted synchronization run
      responses:
        '202':
          description: Synchronization run resumed from its saved progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncRunResponse'
        default:
          description: No resumable run exists, the catalog changed, or another run is active.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/data-sync/retry-failures:
    post:
      operationId: retryFailedDataSyncInstruments
      summary: Start a new run containing only failed instruments from the latest run
      responses:
        '202':
          description: Failed instruments retry accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncRunResponse'
        default:
          description: No failed instruments exist, the catalog changed, or another run is active.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/instruments:
    get:
      security:
        - ApiKey: []
      operationId: listInstruments
      summary: List supported financial instruments
      parameters:
        - $ref: '#/components/parameters/InstrumentType'
        - $ref: '#/components/parameters/Venue'
        - $ref: '#/components/parameters/Publisher'
        - $ref: '#/components/parameters/Capability'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Supported instruments from active providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentListResponse'
        default:
          description: Request failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/instruments/{instrument_id}:
    get:
      security:
        - ApiKey: []
      operationId: getInstrument
      summary: Get one canonical financial instrument
      parameters:
        - name: instrument_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Canonical instrument and provider identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentDetailResponse'
        default:
          description: Request failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/instrument-search:
    get:
      security:
        - ApiKey: []
      operationId: searchInstruments
      summary: Search the canonical instrument catalog
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/InstrumentType'
        - $ref: '#/components/parameters/Venue'
        - $ref: '#/components/parameters/Publisher'
        - $ref: '#/components/parameters/Capability'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked catalog candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentSearchResponse'
        default:
          description: Request failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/instrument-resolve:
    post:
      security:
        - ApiKey: []
      operationId: resolveInstrument
      summary: Resolve user input to a canonical instrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentResolutionRequest'
      responses:
        '200':
          description: Resolution, ambiguity, or not-found result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResolutionResponse'
        default:
          description: Request failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/instruments/{instrument_id}/quote:
    get:
      security:
        - ApiKey: []
      operationId: getQuote
      summary: Get the latest quote for an instrument
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
      responses:
        '200':
          description: Latest normalized quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        default:
          description: Request or provider failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/instruments/{instrument_id}/bars:
    get:
      security:
        - ApiKey: []
      operationId: getBars
      summary: Get normalized OHLCV bars for an instrument
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: interval
          in: query
          schema:
            $ref: '#/components/schemas/BarInterval'
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
        - name: adjustment
          in: query
          description: Equity price adjustment. Indices only support none.
          schema:
            $ref: '#/components/schemas/PriceAdjustment'
        - name: as_of
          in: query
          description: ISO date used as the forward-adjustment anchor; defaults to the current China date.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Chronologically ordered bars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarListResponse'
        default:
          description: Request or provider failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/indices/{instrument_id}/constituents:
    get:
      security:
        - ApiKey: []
      operationId: getIndexConstituents
      summary: Get index constituent memberships
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: as_of
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Index constituents effective on the requested date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexConstituentListResponse'
        default:
          description: Request or provider failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: Market API key
  parameters:
    InstrumentId:
      name: instrument_id
      in: path
      required: true
      schema:
        type: string
    InstrumentType:
      name: instrument_type
      in: query
      schema:
        type: string
        enum: [equity, index]
    Venue:
      name: venue
      in: query
      schema:
        type: string
    Publisher:
      name: publisher
      in: query
      schema:
        type: string
    Capability:
      name: capability
      in: query
      schema:
        $ref: '#/components/schemas/InstrumentCapability'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [schema, data]
      properties:
        schema:
          const: eva.health.v1
        data:
          type: object
          additionalProperties: false
          required: [status, providers, version, uptime_seconds]
          properties:
            status:
              type: string
              enum: [ok, degraded]
            providers:
              type: integer
              minimum: 0
            version:
              type: string
            uptime_seconds:
              type: integer
              minimum: 0
    DataSourceHealth:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - source_id
        - source_name
        - category
        - status
        - capabilities
        - last_checked_at
        - last_success_at
        - latency_ms
        - records_checked
        - error
      properties:
        provider_id:
          type: string
        source_id:
          type: string
        source_name:
          type: string
        category:
          type: string
          enum: [equity, index]
        status:
          type: string
          enum: [unknown, checking, healthy, unhealthy]
        capabilities:
          type: array
          items:
            type: string
        last_checked_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        latency_ms:
          type: [integer, 'null']
          minimum: 0
        records_checked:
          type: [integer, 'null']
          minimum: 0
        error:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
    DataSourceSchedule:
      type: object
      additionalProperties: false
      required: [enabled, interval_seconds, next_check_at]
      properties:
        enabled:
          type: boolean
        interval_seconds:
          type: number
          minimum: 0
        next_check_at:
          type: [string, 'null']
          format: date-time
    DataSourceListResponse:
      type: object
      additionalProperties: false
      required: [schema, data, schedule, generated_at]
      properties:
        schema:
          const: eva.data-source-list.v1
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceHealth'
        schedule:
          $ref: '#/components/schemas/DataSourceSchedule'
        generated_at:
          type: string
          format: date-time
    DataSyncRequest:
      type: object
      additionalProperties: false
      required: [instrument_types, start, end]
      properties:
        instrument_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [equity, index]
        interval:
          type: string
          enum: [1m, 1d]
          default: 1d
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        adjustment:
          $ref: '#/components/schemas/PriceAdjustment'
        limit:
          type: integer
          minimum: 1
          maximum: 20000
        delay_ms:
          type: integer
          minimum: 0
          maximum: 10000
    DataSyncRun:
      type: object
      additionalProperties: true
      required: [run_id, status, interval, total, completed, succeeded, failed, bars_written]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, completed, completed_with_errors, cancelled, failed]
        interval:
          type: string
          enum: [1m, 1d]
        total:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        bars_written:
          type: integer
          minimum: 0
        failed_instrument_ids:
          type: array
          items:
            type: string
        target_instrument_ids:
          type: array
          items:
            type: string
        retry_of_run_id:
          type: string
          format: uuid
    DataSyncRunResponse:
      type: object
      additionalProperties: false
      required: [schema, data]
      properties:
        schema:
          const: eva.data-sync-run.v1
        data:
          $ref: '#/components/schemas/DataSyncRun'
    DataSyncScheduleRequest:
      type: object
      additionalProperties: false
      required: [interval, time, skip_weekends, instrument_types, lookback_days, adjustment, delay_ms]
      properties:
        interval:
          type: string
          enum: [1m, 1d]
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        skip_weekends:
          type: boolean
        instrument_types:
          type: array
          minItems: 1
          items:
            type: string
            enum: [equity, index]
        lookback_days:
          type: integer
          minimum: 1
          maximum: 90
        adjustment:
          $ref: '#/components/schemas/PriceAdjustment'
        delay_ms:
          type: integer
          minimum: 0
          maximum: 10000
    DataSyncSchedule:
      allOf:
        - $ref: '#/components/schemas/DataSyncScheduleRequest'
        - type: object
          required: [schedule_id, enabled, next_run_at, last_triggered_at]
          properties:
            schedule_id:
              type: integer
              minimum: 1
            enabled:
              const: true
            next_run_at:
              type: string
              format: date-time
            last_triggered_at:
              oneOf:
                - type: 'null'
                - type: string
                  format: date-time
    DataSyncScheduleResponse:
      type: object
      additionalProperties: false
      required: [schema, data]
      properties:
        schema:
          const: eva.data-sync-schedule.v1
        data:
          $ref: '#/components/schemas/DataSyncSchedule'
    DataSyncStatusResponse:
      type: object
      additionalProperties: false
      required: [schema, data, generated_at]
      properties:
        schema:
          const: eva.data-sync-status.v1
        data:
          type: object
          additionalProperties: true
          required: [database_path, storage, active_run, last_run, schedules]
          properties:
            database_path:
              type: string
            storage:
              type: object
              additionalProperties: true
            active_run:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/DataSyncRun'
            last_run:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/DataSyncRun'
            schedules:
              type: array
              items:
                $ref: '#/components/schemas/DataSyncSchedule'
        generated_at:
          type: string
          format: date-time
    InstrumentCapability:
      type: string
      enum: [quote, bars, constituents]
    BarInterval:
      type: string
      enum: [1m, 5m, 15m, 30m, 60m, 1d, 1w, 1mo]
      default: 1d
    PriceAdjustment:
      type: string
      enum: [none, forward, backward]
      default: none
    Instrument:
      type: object
      additionalProperties: false
      required:
        - instrument_id
        - instrument_type
        - market
        - name
        - symbol
        - venue
        - publisher
        - currency
        - status
        - aliases
        - capabilities
      properties:
        instrument_id:
          type: string
        instrument_type:
          type: string
          enum: [equity, index]
        market:
          const: CN
        name:
          type: string
        symbol:
          type: string
        venue:
          type: [string, 'null']
        publisher:
          type: [string, 'null']
        currency:
          type: string
        status:
          type: string
          enum: [active, inactive]
        aliases:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentCapability'
    ProviderIdentifier:
      type: object
      additionalProperties: false
      required: [provider, value, capabilities]
      properties:
        provider:
          type: string
        value:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentCapability'
    InstrumentDetail:
      allOf:
        - $ref: '#/components/schemas/Instrument'
        - type: object
          required: [identifiers]
          properties:
            identifiers:
              type: array
              items:
                $ref: '#/components/schemas/ProviderIdentifier'
    InstrumentSearchMatch:
      allOf:
        - $ref: '#/components/schemas/Instrument'
        - type: object
          required: [match_type, score]
          properties:
            match_type:
              type: string
              enum:
                - exact_id
                - exact_symbol
                - exact_name
                - exact_alias
                - prefix
                - contains
                - fuzzy
            score:
              type: number
    Page:
      type: object
      additionalProperties: false
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']
    Source:
      type: object
      additionalProperties: false
      required: [provider, fetched_at]
      properties:
        provider:
          type: string
        upstream:
          type: string
          description: Actual upstream source selected inside the provider.
        fetched_at:
          type: string
          format: date-time
        stale:
          type: boolean
          default: false
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - request_id
        - generated_at
        - partial
        - sources
        - warnings
      properties:
        request_id:
          type: string
        generated_at:
          type: string
          format: date-time
        partial:
          type: boolean
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        warnings:
          type: array
          items:
            type: string
    InstrumentListResponse:
      type: object
      additionalProperties: false
      required: [schema, data, page, meta]
      properties:
        schema:
          const: eva.instrument-list.v1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    InstrumentDetailResponse:
      type: object
      additionalProperties: false
      required: [schema, data, meta]
      properties:
        schema:
          const: eva.instrument.v1
        data:
          $ref: '#/components/schemas/InstrumentDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    InstrumentSearchResponse:
      type: object
      additionalProperties: false
      required: [schema, data, page, meta]
      properties:
        schema:
          const: eva.instrument-search.v1
        data:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentSearchMatch'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    InstrumentResolutionContext:
      type: object
      additionalProperties: false
      properties:
        instrument_type:
          type: string
          enum: [equity, index]
        venue:
          type: string
        publisher:
          type: string
        capability:
          $ref: '#/components/schemas/InstrumentCapability'
    InstrumentResolutionRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        context:
          $ref: '#/components/schemas/InstrumentResolutionContext'
    InstrumentResolutionData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, ambiguous, not_found]
        instrument:
          $ref: '#/components/schemas/InstrumentSearchMatch'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentSearchMatch'
    InstrumentResolutionResponse:
      type: object
      additionalProperties: false
      required: [schema, data, meta]
      properties:
        schema:
          const: eva.instrument-resolution.v1
        data:
          $ref: '#/components/schemas/InstrumentResolutionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Quote:
      type: object
      additionalProperties: false
      required:
        - instrument_id
        - symbol
        - name
        - venue
        - publisher
        - currency
        - market_time
        - observed_at
        - market_status
        - last
        - open
        - high
        - low
        - previous_close
        - volume
        - turnover
      properties:
        instrument_id:
          type: string
        symbol:
          type: string
        name:
          type: string
        venue:
          type: [string, 'null']
        publisher:
          type: [string, 'null']
        currency:
          type: string
        market_time:
          type: [string, 'null']
          format: date-time
        observed_at:
          type: string
          format: date-time
        market_status:
          type: string
          enum: [trading, closed, halted, auction, unknown]
        last:
          type: [string, 'null']
        open:
          type: [string, 'null']
        high:
          type: [string, 'null']
        low:
          type: [string, 'null']
        previous_close:
          type: [string, 'null']
        volume:
          type: [integer, 'null']
        turnover:
          type: [string, 'null']
    QuoteResponse:
      type: object
      additionalProperties: false
      required: [schema, data, meta]
      properties:
        schema:
          const: eva.quote.v1
        data:
          $ref: '#/components/schemas/Quote'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Bar:
      type: object
      additionalProperties: false
      required:
        - instrument_id
        - interval
        - trading_date
        - period_start
        - period_end
        - currency
        - open
        - high
        - low
        - close
        - volume
        - turnover
        - adjustment
        - complete
      properties:
        instrument_id:
