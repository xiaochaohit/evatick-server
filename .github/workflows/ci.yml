name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m pip install "./providers/akshare-python[test]"
      - run: python -m pytest -q providers/akshare-python/tests
