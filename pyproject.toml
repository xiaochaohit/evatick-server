[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-cli"
version = "0.3.0"
description = "Lightweight HTTP client for Market Server v1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
]

[project.optional-dependencies]
parquet = ["pyarrow>=18,<24"]
test = ["pytest>=9,<10"]

[project.scripts]
market-cli = "market_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["market_cli*"]
